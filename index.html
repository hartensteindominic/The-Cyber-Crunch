<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple 3D Hologram Creator</title>
<style>
:root{--bg:#030712;--panel:#111827;--accent:#3b82f6;--text:#f9fafb;--muted:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
#sidebar{width:320px;background:var(--panel);border-right:1px solid #1f2937;display:flex;flex-direction:column;padding:16px;gap:16px;z-index:10}
h1{font-size:16px;font-weight:800;color:var(--accent);letter-spacing:1px}
.control-group{display:flex;flex-direction:column;gap:8px}
label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity 0.2s}
button:hover{opacity:0.9}
button.secondary{background:#374151}
#viewer{flex:1;position:relative}
canvas{display:block;width:100%;height:100%}
#vid{display:none}
.hint{font-size:11px;color:var(--muted);line-height:1.4}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="sidebar">
  <h1>✨ 3D Hologram Maker</h1>
  <div class="hint">Turn your webcam stream into a live interactive 3D particle hologram instantly.</div>

  <div class="control-group">
    <button id="camBtn" onclick="toggleCamera()">📷 Start Camera</button>
  </div>

  <div class="control-group">
    <label>Hologram Depth / Pop-out</label>
    <input type="range" id="depthRange" min="20" max="250" value="100" oninput="depthFactor = +this.value">
  </div>

  <div class="control-group">
    <label>Particle Glow Size</label>
    <input type="range" id="sizeRange" min="0.003" max="0.02" value="0.007" step="0.001" oninput="particleSize = +this.value; updateSize()">
  </div>

  <div class="control-group" style="margin-top:auto">
    <button class="secondary" onclick="saveHologramImage()">💾 Save Hologram Snapshot</button>
  </div>
</div>

<div id="viewer">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="c3"></canvas>
</div>

<script>
const $ = id => document.getElementById(id);

let scene, camera, renderer, controls, particleMesh;
let video, canvas2D, ctx2D;
let streamRunning = false;
let depthFactor = 100, particleSize = 0.007;

window.addEventListener('DOMContentLoaded', () => {
  initThree();
  initVideoSource();
  animate();
});

function initThree() {
  const container = $('viewer');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030712, 0.01);

  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 0, 3);

  renderer = new THREE.WebGLRenderer({ canvas: $('c3'), antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.0;

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}

function initVideoSource() {
  video = $('vid');
  canvas2D = document.createElement('canvas');
  ctx2D = canvas2D.getContext('2d', { willReadFrequently: true });
}

function toggleCamera() {
  if (!streamRunning) {
    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
      .then(s => {
        video.srcObject = s;
        video.play();
        streamRunning = true;
        $('camBtn.textContent') = '🔴 Stop Camera';
      })
      .catch(() => alert('Camera access denied or unavailable.'));
  } else {
    const s = video.srcObject;
    if (s) s.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    streamRunning = false;
    $('camBtn').textContent = '📷 Start Camera';
  }
}

function updateSize() {
  if (particleMesh) particleMesh.material.size = particleSize;
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (streamRunning && video.readyState >= 2) {
    processVideoFrame();
  }

  renderer.render(scene, camera);
}

function processVideoFrame() {
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  if (canvas2D.width !== w || canvas2D.height !== h) {
    canvas2D.width = w;
    canvas2D.height = h;
  }

  ctx2D.drawImage(video, 0, 0, w, h);
  const imgData = ctx2D.getImageData(0, 0, w, h).data;

  const positions = [];
  const colors = [];
  const step = 4; // Skip pixels for performance

  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const i = (y * w + x) * 4;
      const r = imgData[i] / 255;
      const g = imgData[i + 1] / 255;
      const b = imgData[i + 2] / 255;
      
      const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
      if (brightness < 0.1) continue; // Skip dark background

      const posX = (x / w) * 2 - 1;
      const posY = -((y / h) * 2 - 1);
      const posZ = (brightness - 0.5) * (depthFactor * 0.01);

      positions.push(posX * 1.2, posY * 1.2, posZ);
      colors.push(r, g, b);
    }
  }

  if (!particleMesh) {
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    
    const mat = new THREE.PointsMaterial({
      size: particleSize,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      sizeAttenuation: true
    });

    particleMesh = new THREE.Points(geom, mat);
    scene.add(particleMesh);
  } else {
    particleMesh.geometry.attributes.position.array.set(positions);
    particleMesh.geometry.attributes.position.needsUpdate = true;
    particleMesh.geometry.attributes.color.array.set(colors);
    particleMesh.geometry.attributes.color.needsUpdate = true;
  }
}

function saveHologramImage() {
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = 'hologram-snapshot.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
